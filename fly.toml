# fly.toml app configuration file generated for ironfolk-combat-misty-butterfly-5508 on 2025-12-13T02:33:02+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "ironfolk-combat-misty-butterfly-5508"
primary_region = "syd"
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "www.ironfolkcombat.co.nz"
  PORT = "8080"
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  memory = '512mb'
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = "/app/lib/ironfolk_combat-0.1.0/priv/static"
  url_prefix = "/assets"
