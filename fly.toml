# fly.toml app configuration file generated for ironfolk-combat-misty-butterfly-5508 on 2025-12-13T02:33:02+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ironfolk-combat-misty-butterfly-5508'
primary_region = 'syd'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'ironfolk-combat-misty-butterfly-5508.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
